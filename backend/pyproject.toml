[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "H4rdeol", email = "harde0l@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bson>=0.5.10",
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "mistralai>=3.8.0",
    "pymongo>=4.20.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
]
