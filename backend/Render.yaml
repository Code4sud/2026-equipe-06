services:
  - type: web
    name: backend
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: backend
      - key: HOST
        value: 0.0.0.0
      - key: DB_URI
        sync: false
      - key: DB_NAME
        value: monhackathon
      - key: MISTRAL_API_KEY
        sync: false
      - key: AUTH_CODE_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

