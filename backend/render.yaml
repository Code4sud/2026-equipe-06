services:
  - type: web
    name: backend
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: backend
      - key: HOST
        value: 0.0.0.0
      - key: DB_URI
        sync: false
      - key: DB_NAME
        value: monhackathon
      - key: MISTRAL_API_KEY
        sync: false
      - key: AUTH_CODE_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false



